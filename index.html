<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fake Name Generator</title>
  <style>
    *{box-sizing:border-box;font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif;margin:0;padding:0}
    body{height:100vh;width:100vw;display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#071025 0%, #071428 60%);color:#e6eef8}
    .name-box{background:rgba(255,255,255,0.06);padding:22px 36px;border-radius:14px;font-weight:700;font-size:30px;cursor:pointer;user-select:none;text-align:center;min-width:280px}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:#0b1220;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.03);box-shadow:0 8px 30px rgba(2,6,23,0.6);display:none;font-size:14px}
  </style>
</head>
<body>
  <div id="nameBox" class="name-box">Loading…</div>
  <div class="toast" id="toast">Copied</div>

  <script>
    // Sample pools — easily editable or expandable
    const firstNames = ['Aarav','Arjun','Raihan','Sami','Tariq','Rafi','Nayan','Imran','Kamal','Rabin','Maya','Rina','Sadia','Lina','Ayesha','Nadia','Mithila','Taslima','Anika','Sofia','Alex','Kai','Noah','Ethan','Liam','Mila','Zara','Luca','Ivy'];
    const lastNames = ['Chowdhury','Hossain','Rahman','Sarker','Islam','Ahmed','Khan','Das','Roy','Biswas','Smith','Johnson','Patel','Garcia','Nguyen','Silva','Costa','Ivanov','Kowalski'];

    const nameBox = document.getElementById('nameBox');
    const toast = document.getElementById('toast');

    function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

    function generateName(){
      let first = rand(firstNames);
      let last = rand(lastNames);
      if(Math.random() < 0.15) first += ' ' + rand(firstNames); // sometimes two first names
      if(Math.random() < 0.10) last += '-' + rand(lastNames);    // sometimes hyphenated last
      return `${first} ${last}`;
    }

    async function copyText(text){
      try{
        await navigator.clipboard.writeText(text);
        return true;
      }catch{
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return true;
      }
    }

    function showToast(msg){
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(()=>{ toast.style.display = 'none'; }, 1200);
    }

    async function copyAndNew(){
      const current = nameBox.textContent;
      if(!current || current==='Loading…') return;
      const ok = await copyText(current);
      if(ok && navigator.vibrate) navigator.vibrate(50);
      showToast('Copied: ' + current);
      setTimeout(()=>{ nameBox.textContent = generateName(); }, 120);
    }

    nameBox.addEventListener('click', copyAndNew);

    // initialize with first generated name
    nameBox.textContent = generateName();
  </script>
</body>
</html>
